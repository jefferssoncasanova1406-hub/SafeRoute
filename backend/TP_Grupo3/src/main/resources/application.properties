spring.application.name = grupo3
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://${RDS_HOSTNAME:localhost}:${RDS_PORT:5432}/${RDS_DB_NAME:grupo3API}}
spring.datasource.username=${DB_USERNAME:${RDS_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${RDS_PASSWORD:0703}}
